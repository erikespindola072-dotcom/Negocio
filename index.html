<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e7c86">
  <title>TruckBook</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,750&family=Figtree:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
  <style>:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }</style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><img src="icon.svg" alt="" width="28" height="28"><span id="bizName">TruckBook</span></div>
    <div class="topbar-right"><span id="syncPill" class="sync" hidden></span><span class="today" id="todayLabel"></span></div>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabs" id="tabs">
    <button data-tab="home"><span>🏠</span>Home</button>
    <button data-tab="stock"><span>📦</span>Stock</button>
    <button data-tab="buy"><span>🛒</span>Buy</button>
    <button data-tab="sales"><span>💵</span>Sales</button>
    <button data-tab="expenses"><span>🧾</span>Costs</button>
    <button data-tab="menu"><span>🌮</span>Menu</button>
    <button data-tab="more"><span>⚙️</span>More</button>
  </nav>

  <dialog id="modal"><div id="modalBody"></div></dialog>
  <dialog id="ask"><div class="ask-body"><p id="askMsg"></p>
    <div class="row end gap"><button type="button" class="btn" id="askCancel">Cancel</button><button type="button" class="btn danger" id="askOk">Delete</button></div></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
