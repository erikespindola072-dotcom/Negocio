<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e7c86">
  <title>TruckBook</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><img src="icon.svg" alt="" width="28" height="28"><span id="bizName">TruckBook</span></div>
    <div class="today" id="todayLabel"></div>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabs" id="tabs">
    <button data-tab="home"><span>🏠</span>Home</button>
    <button data-tab="stock"><span>📦</span>Stock</button>
    <button data-tab="buy"><span>🛒</span>Buy</button>
    <button data-tab="sales"><span>💵</span>Sales</button>
    <button data-tab="expenses"><span>🧾</span>Costs</button>
    <button data-tab="menu"><span>🌮</span>Menu</button>
    <button data-tab="more"><span>⚙️</span>More</button>
  </nav>

  <dialog id="modal"><div id="modalBody"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
